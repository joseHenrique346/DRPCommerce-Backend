name: drp-gateway

services:
  gateway:
    image: ${GATEWAY_IMAGE:?Defina GATEWAY_IMAGE no arquivo .env}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:8080;https://+:8443
      Kestrel__Certificates__Default__Path: /https/gateway.pfx
    ports:
      - "${BIND_IP:-10.0.0.7}:443:8443"
    volumes:
      - type: bind
        source: ${TLS_CERTIFICATE_PATH:?Defina TLS_CERTIFICATE_PATH no arquivo .env}
        target: /https/gateway.pfx
        read_only: true
        bind:
          create_host_path: false
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data-protection-keys:
